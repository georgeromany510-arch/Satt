<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT Vocabulary Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#0e1230;--card:#181d42;--tx:#eef0ff;--mu:#9aa2d6;--ac:#7c5cff;--ac2:#22d3ee;--ok:#34d399;--bad:#fb7185;--bd:#2d3470}
[data-theme=light]{--bg:#eceffd;--card:#fff;--tx:#1a1e40;--mu:#59629a;--bd:#cfd5f7;--ok:#059669;--bad:#e11d48}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#scene{position:fixed;inset:0;perspective:900px;overflow:hidden;pointer-events:none;z-index:0}
.cube{position:absolute;transform-style:preserve-3d;animation:sp 18s linear infinite;opacity:.55}
.cube i{position:absolute;inset:0;border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.cube i:nth-child(1){transform:translateZ(var(--h))}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(var(--h))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(var(--h))}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(var(--h))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(var(--h))}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(var(--h))}
@keyframes sp{from{transform:rotateX(0) rotateY(0)}to{transform:rotateX(360deg) rotateY(360deg)}}
@media(prefers-reduced-motion:reduce){.cube{animation:none}}
header{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;padding:22px 16px 8px}
h1{margin:0;font-size:clamp(24px,4vw,40px);letter-spacing:.06em;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 6px 18px color-mix(in srgb,var(--ac) 35%,transparent)}
#tg{position:absolute;right:18px;top:20px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px;cursor:pointer}
.app{position:relative;z-index:1;display:flex;gap:18px;max-width:1150px;margin:12px auto;padding:0 16px}
aside{width:250px;flex:none;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;align-self:flex-start;box-shadow:0 8px 0 var(--bd);max-height:80vh;overflow:auto}
aside h4{margin:16px 0 6px;color:var(--mu);font-weight:600}
.nb{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 12px;border-radius:12px;border:2px solid var(--bd);background:transparent;color:var(--tx);font-size:15px;cursor:pointer}
.nb.on,.nb:hover{background:var(--ac);border-color:var(--ac);color:#fff}
.h{display:flex;justify-content:space-between;gap:6px;padding:7px 4px;border-bottom:1px solid var(--bd)}
.h a{cursor:pointer;word-break:break-word}.h a:hover{color:var(--ac2)}.h span{cursor:pointer;color:var(--mu)}.h span:hover{color:var(--bad)}
aside input{width:100%;margin-top:14px;padding:8px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
main{flex:1;min-width:0}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:22px;box-shadow:0 8px 0 var(--bd)}
h2{margin:0 0 12px}h3{margin:18px 0 8px}small,.mu{color:var(--mu)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.drop{display:block;border:3px dashed var(--ac);border-radius:18px;padding:44px 12px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover{background:color-mix(in srgb,var(--ac) 12%,transparent);transform:translateY(-3px)}
.btn,.btn2{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;margin:14px 8px 0 0;color:#fff;background:var(--ac);box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 55%,#000)}
.btn2{background:transparent;color:var(--tx);border:2px solid var(--bd);box-shadow:0 5px 0 var(--bd)}
.btn:active,.btn2:active,.opt:active{transform:translateY(4px);box-shadow:none}
.row{display:grid;grid-template-columns:1.1fr 1.1fr 2fr;gap:12px;padding:9px 4px;border-bottom:1px solid var(--bd);align-items:center}
.row em{color:var(--mu);font-style:normal}.list{max-height:55vh;overflow:auto}
.top{display:flex;justify-content:space-between;color:var(--mu)}
.bar{height:8px;background:var(--bg);border-radius:8px;margin:10px 0 20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.q{font-size:22px;line-height:1.5;margin:0 0 18px}
.opt{display:block;width:100%;text-align:start;margin:0 0 12px;padding:14px 16px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--bd);transition:.15s}
.opt:hover,.opt.sel{border-color:var(--ac2);transform:translateY(-2px)}.opt.sel{background:color-mix(in srgb,var(--ac) 25%,var(--bg))}
.score{font-size:54px;font-weight:800;margin:6px 0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.w{padding:10px 4px;border-bottom:1px solid var(--bd)}.w small{display:block;margin:3px 0}
label.row{grid-template-columns:auto 1fr auto;cursor:pointer}
@media(max-width:760px){.app{flex-direction:column}aside{width:100%;max-height:none}.row{grid-template-columns:1fr}#tg{position:static;margin-left:12px}header{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="scene"></div>
<header><h1>SAT VOCABULARY TOOL</h1><button id="tg" aria-label="Toggle theme">◐ Theme</button></header>
<div class="app"><aside id="aside"></aside><main id="main"></main></div>
<script>
// Temporary: paste a free Gemini key here, or in the sidebar box. Later move it to .env (see notes).
const ENV_KEY = "", MODEL = "gemini-3.8-flash";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = s => document.querySelector(s), main = $("#main");
const db = JSON.parse(localStorage.satdb || '{"pdfs":[],"rev":[]}');
const save = () => localStorage.satdb = JSON.stringify(db);
const sh = a => [...a].sort(() => Math.random() - .5);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const EX = { 1: "Word → Arabic meaning", 2: "Word → English definition", 3: "Sentence → missing word", 4: "DSAT-level context" };
let cur = null, nx = null;

// theme + 3D background
document.documentElement.dataset.theme = localStorage.th || "dark";
$("#tg").onclick = () => { const t = document.documentElement.dataset.theme == "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; localStorage.th = t; };
for (let i = 0; i < 9; i++) {
  const c = document.createElement("div"), s = 30 + Math.random() * 55;
  c.className = "cube";
  c.style.cssText = `left:${Math.random() * 94}%;top:${Math.random() * 88}%;width:${s}px;height:${s}px;--h:${s / 2}px;animation-duration:${12 + Math.random() * 18}s`;
  c.innerHTML = "<i></i>".repeat(6);
  $("#scene").append(c);
}

// sidebar
function nav(a) {
  $("#aside").innerHTML = `<button class="nb ${a == "new" ? "on" : ""}" onclick="vNew()">＋ New</button>
  <button class="nb ${a == "rev" ? "on" : ""}" onclick="vRev()">⟲ Revision</button><h4>History</h4>
  ${[...db.pdfs].reverse().map(p => `<div class="h"><a onclick="sum(${p.id})">${esc(p.name)}</a><span onclick="del(${p.id})" title="Delete">×</span></div>`).join("") || '<p class="mu">No PDFs yet.</p>'}
  <input type="password" placeholder="Gemini API key" value="${esc(localStorage.k || "")}" onchange="localStorage.k=this.value.trim()">`;
}
function del(id) { if (confirm("Delete this PDF from history?")) { db.pdfs = db.pdfs.filter(p => p.id != id); save(); vNew(); } }

// new PDF
function vNew() {
  nav("new");
  main.innerHTML = `<div class="card"><h2>Upload a vocabulary PDF</h2><p class="mu">The AI reads every word and its Arabic translation, then builds four exams from them.</p>
  <label class="drop"><input type="file" id="f" accept="application/pdf" hidden>Click to choose a PDF</label><div id="st"></div></div>`;
  $("#f").onchange = e => e.target.files[0] && proc(e.target.files[0]);
}
async function proc(file) {
  const st = $("#st"), say = t => st.innerHTML = `<p>${t}</p>`;
  try {
    say("Reading PDF…");
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let txt = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const c = await (await pdf.getPage(i)).getTextContent(); let y = null;
      for (const it of c.items) { const ny = it.transform[5]; txt += (y === null ? "" : Math.abs(ny - y) > 3 ? "\n" : " ") + it.str; y = ny; }
      txt += "\n";
    }
    if (!txt.trim()) throw Error("No text found in this PDF. Scanned PDFs are not supported.");
    const ch = []; let b = "";
    for (const l of txt.split("\n")) { if ((b + l).length > 5000) { ch.push(b); b = ""; } b += l + "\n"; }
    if (b.trim()) ch.push(b);
    const words = [], seen = new Set();
    for (let i = 0; i < ch.length; i++) {
      say(`AI is analysing part ${i + 1} of ${ch.length}… (${words.length} words found)`);
      for (const x of await ai(ch[i])) {
        const k = (x && x.w || "").toLowerCase().trim();
        if (k && x.ar && !seen.has(k)) { seen.add(k); words.push({ w: x.w.trim(), ar: x.ar, def: x.def || "", q: x.q || "", h: x.h || "", miss: 0 }); }
      }
    }
    if (!words.length) throw Error("No vocabulary words were found.");
    const p = { id: Date.now(), name: file.name.replace(/\.pdf$/i, ""), words, att: [] };
    db.pdfs.push(p); save(); study(p);
  } catch (e) { st.innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
}
async function ai(t, n = 0) {
  const key = localStorage.k || ENV_KEY;
  if (!key) throw Error("Add your Gemini API key in the box at the bottom of the sidebar.");
  const prompt = `Below is text from an English vocabulary PDF (words with Arabic translations). Extract EVERY vocabulary word. Return a JSON array; each item: {"w": English word, "ar": Arabic translation (use the one in the text; if missing, write it), "def": short clear English definition, "q": an easy English sentence with the word replaced by ____, "h": a harder SAT-style 1-2 sentence academic context where only this word fits, with the word replaced by ____}. No duplicates, no commentary.\n\n${t}`;
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${key}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: .3 } })
  });
  if (r.status == 429 && n < 3) { await new Promise(s => setTimeout(s, 20000)); return ai(t, n + 1); }
  const j = await r.json(); if (!r.ok) throw Error(j.error?.message || "API error");
  try { return JSON.parse(j.candidates[0].content.parts[0].text); } catch { if (n < 2) return ai(t, n + 1); throw Error("The AI returned an invalid answer. Try again."); }
}

// study list
function study(p) {
  cur = { p }; nav("new");
  main.innerHTML = `<div class="card"><h2>${esc(p.name)} <small>${p.words.length} words</small></h2>
  <div class="list">${p.words.map(x => `<div class="row"><b>${esc(x.w)}</b><span dir="rtl">${esc(x.ar)}</span><em>${esc(x.def)}</em></div>`).join("")}</div>
  <button class="btn" onclick="exam(1)">Start Exam 1</button></div>`;
}

// exams
function mk(t, w, pool) {
  const k = t == 1 ? "ar" : t == 2 ? "def" : "w";
  const o = sh([w, ...sh(pool.filter(x => x != w && x[k] != w[k])).slice(0, 3)]);
  const prompt = t < 3 ? w.w : (t == 3 ? w.q : w.h) || "Which word means: " + w.def;
  return { t: prompt, w, ty: t, opts: o.map(x => x[k]), a: o.indexOf(w) };
}
function exam(t) {
  const p = cur.p;
  if (t > 4) return main.innerHTML = `<div class="card"><h2>Round complete</h2><p>Do you want more exams on this PDF?</p>
  <button class="btn" onclick="exam(1)">Yes, another round</button><button class="btn2" onclick="sum(cur.p,10)">No, show my weak words</button></div>`;
  run(sh(p.words).map(w => mk(t, w, p.words)), `Exam ${t}: ${EX[t]}`, p.att, () => exam(t + 1), t < 4 ? `Start Exam ${t + 1}` : "Finish");
}
function run(qs, title, log, next, label) {
  let i = 0; const ans = [];
  const show = () => {
    const q = qs[i];
    main.innerHTML = `<div class="card"><div class="top"><span>${esc(title)}</span><span>${i + 1} / ${qs.length}</span></div>
    <div class="bar"><i style="width:${i / qs.length * 100}%"></i></div><h3 class="q" dir="auto">${esc(q.t)}</h3>
    ${q.opts.map((o, j) => `<button class="opt" dir="auto" data-j="${j}">${esc(o)}</button>`).join("")}</div>`;
    main.querySelectorAll(".opt").forEach(b => b.onclick = () => { ans.push(+b.dataset.j); b.classList.add("sel"); setTimeout(() => ++i < qs.length ? show() : fin(), 220); });
  };
  const fin = () => {
    const bad = qs.filter((q, n) => ans[n] !== q.a), sc = qs.length - bad.length;
    bad.forEach(q => q.w.miss++); log.push({ e: title, s: sc, n: qs.length, d: Date.now() }); save();
    nx = next;
    main.innerHTML = `<div class="card"><h2>${esc(title)}</h2><div class="score">${sc} / ${qs.length}</div><p class="mu">${Math.round(sc / qs.length * 100)}%</p>
    ${bad.length ? `<h3>You missed ${bad.length}</h3>` + qs.map((q, n) => ans[n] === q.a ? "" : `<div class="w"><b>${esc(q.w.w)}</b>${q.ty > 2 ? `<small dir="auto">${esc(q.t)}</small>` : ""}
    <span class="bad" dir="auto">✗ ${esc(q.opts[ans[n]])}</span><br><span class="ok" dir="auto">✓ ${esc(q.opts[q.a])}</span></div>`).join("") : '<h3 class="ok">Perfect score!</h3>'}
    <button class="btn" onclick="nx()">${label}</button></div>`;
  };
  show();
}

// history / weak words
function sum(p, top) {
  p = typeof p == "object" ? p : db.pdfs.find(x => x.id == p); if (!p) return;
  nav(); const m = p.words.filter(w => w.miss).sort((a, b) => b.miss - a.miss).slice(0, top || 999);
  main.innerHTML = `<div class="card"><h2>${esc(p.name)} <small>${p.words.length} words</small></h2><h3>Most missed words</h3>
  ${m.length ? m.map(w => `<div class="row"><b>${esc(w.w)}</b><span dir="rtl">${esc(w.ar)}</span><em class="bad">missed ${w.miss}×</em></div>`).join("") : '<p class="ok">No mistakes recorded.</p>'}
  <h3>Attempts</h3>${p.att.length ? p.att.slice().reverse().slice(0, 40).map(a => `<div class="row"><span>${esc(a.e)}</span><b>${a.s} / ${a.n}</b><em>${new Date(a.d).toLocaleDateString()}</em></div>`).join("") : '<p class="mu">None yet.</p>'}
  <button class="btn" onclick="vNew()">＋ New PDF</button><button class="btn2" onclick="study(db.pdfs.find(x=>x.id==${p.id}))">Study list</button></div>`;
}

// revision
function vRev() {
  nav("rev"); const P = db.pdfs;
  main.innerHTML = `<div class="card"><h2>Revision</h2>${P.length ? `<p class="mu">Tick the PDFs to revise. Every word in them becomes a question (medium to hard, all multiple choice).</p>
  ${P.map(p => `<label class="row"><input type="checkbox" class="ck" value="${p.id}" checked><span>${esc(p.name)}</span><small>${p.words.length}</small></label>`).join("")}
  <button class="btn" onclick="revGo(0)">Exam on selected PDFs</button><button class="btn2" onclick="revGo(1)">Comprehensive: all ${P.reduce((a, p) => a + p.words.length, 0)} words</button>` : "<p>Upload a PDF first, then come back here.</p>"}</div>`;
}
function revGo(all) {
  const ids = [...document.querySelectorAll(".ck:checked")].map(c => +c.value);
  const ws = db.pdfs.filter(p => all || ids.includes(p.id)).flatMap(p => p.words);
  if (!ws.length) return alert("Select at least one PDF.");
  run(sh(ws).map(w => mk(sh([1, 2, 3, 3, 4, 4])[0], w, ws)), `Revision: ${ws.length} questions`, db.rev, vRev, "Back to Revision");
}
vNew();
</script>
</body>
</html>
